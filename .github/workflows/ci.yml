name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/pokemon-showdown/package-lock.json

      - name: Build pinned Showdown
        run: |
          npm ci --prefix vendor/pokemon-showdown
          npm run build --prefix vendor/pokemon-showdown

      - name: Verify generated Champions data
        run: node tools/showdown-export/export-champions.cjs --check

      - name: Validate Regulation M-C team fixture against Showdown
        run: node tools/showdown-reference/validate-team.cjs data/fixtures/teams/valid-reg-mc.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

